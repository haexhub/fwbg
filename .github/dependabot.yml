# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      ml:
        patterns:
          - "xgboost"
          - "scikit-learn"
          - "numpy"
          - "pandas"
        update-types: ["minor", "patch"]
      dev-tools:
        patterns:
          - "ruff"
          - "pytest*"
          - "mypy"
        update-types: ["minor", "patch"]

  # Sub-packages each have their own pyproject.toml and are pip-installed
  # separately (see deploy.yml's `pip install -e packages/...`).
  - package-ecosystem: "pip"
    directory: "/packages/fwbg-sdk"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/packages/fwbg-premium"

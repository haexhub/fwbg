# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      # Skip 5.0.0 until the adapter supports Dukascopy 5.x; allow later 5.x releases.
      - dependency-name: "dukascopy-python"
        versions: ["5.0.0"]
    groups:
      ml:
        patterns:
          - "xgboost"
          - "scikit-learn"
          - "numpy"
          - "pandas"
        update-types: ["minor", "patch"]
      dev-tools:
        patterns:
          - "ruff"
          - "pytest*"
          - "mypy"
        update-types: ["minor", "patch"]

  # Sub-packages each have their own pyproject.toml and are pip-installed
  # separately (see deploy.yml's `pip install -e packages/...`).
  - package-ecosystem: "pip"
    directory: "/packages/fwbg-sdk"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/packages/fwbg-broker-ig"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/packages/fwbg-broker-template"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/packages/fwbg-mcp"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # numba needs numpy<2.5, and numpy 2.4.x has no wheels for Python 3.15:
      # on 3.15 pip builds numpy from source and the slim image has no compiler.
      - dependency-name: "python"
        versions: [">=3.15"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Bot-Optimizer Parity Tests
        run: |
          python -m pytest tests/test_bot_optimizer_parity.py -v --tb=short

      - name: Run Data Loader Tests
        run: |
          python -m pytest tests/test_data_loader.py -v --tb=short

      - name: Run Cache Logic Tests
        run: |
          python -m pytest tests/test_cache_logic.py -v --tb=short

      - name: Run Streaming Unit Tests
        run: |
          python -m pytest tests/test_streaming.py -v --tb=short

      - name: Run Simulation Tests
        run: |
          python -m pytest tests/test_simulation.py -v --tb=short

      - name: Run Validation Tests
        run: |
          python -m pytest tests/test_validation.py -v --tb=short

      - name: Run Core Indicator Tests
        run: |
          python -m pytest tests/test_core_indicators.py -v --tb=short

      - name: Run Preprocessing Tests
        run: |
          python -m pytest tests/test_preprocessing.py -v --tb=short

      - name: Run Regime Tests
        run: |
          python -m pytest tests/test_regime.py -v --tb=short

      - name: Run Risk Tests
        run: |
          python -m pytest tests/test_risk.py -v --tb=short

      - name: Run Structure Tests
        run: |
          python -m pytest tests/test_structure.py -v --tb=short

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: haexhub
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,prefix=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


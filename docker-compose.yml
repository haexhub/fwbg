services:
  # Trading Bot
  ig-bot:
    image: ghcr.io/haexhub/fwbg:latest
    container_name: fwbg-bot
    restart: unless-stopped
    volumes:
      - fwbg-accounts:/app/accounts
      - fwbg-data:/app/data
      - fwbg-logs:/app/logs
      - fwbg-stats:/app/data/stats_export
      # Workspace (~/fwbg): strategy configs + test results. Without this
      # mount every image update wipes published strategies and backtests.
      - fwbg-workspace:/root/fwbg
      # Agent-authored plugins: persisted across redeploys, shared with api
      # so live trading can use plugins registered by the agents service.
      - fwbg-agent-plugins:/root/.fwbg/plugins
    environment:
      - TZ=Europe/Berlin
      - LOG_DIR=/app/logs
      - STATS_DIR=/app/data/stats_export
      - FWBG_DATA_DIR=/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # REST API server (datasources, backtests, Dukascopy, etc.).
  # Runs from the same image as the bot but serves `fwbg.api:app` — the bot's
  # default `python -m fwbg` only trades and never starts the API, which the
  # dashboard and agents both depend on (FWBG_API_URL).
  api:
    image: ghcr.io/haexhub/fwbg:latest
    container_name: fwbg-api
    restart: unless-stopped
    command: ["uvicorn", "fwbg.api:app", "--host", "0.0.0.0", "--port", "8420"]
    volumes:
      - fwbg-accounts:/app/accounts
      - fwbg-data:/app/data
      - fwbg-logs:/app/logs
      - fwbg-stats:/app/data/stats_export
      # Same workspace as ig-bot: published strategies must survive redeploys
      # and be visible to both the API and the bot.
      - fwbg-workspace:/root/fwbg
      # Agent-authored plugins: shared with ig-bot so registered plugins
      # persist across redeploys and are available to the bot as well.
      - fwbg-agent-plugins:/root/.fwbg/plugins
    environment:
      - TZ=Europe/Berlin
      - LOG_DIR=/app/logs
      - STATS_DIR=/app/data/stats_export
      - FWBG_DATA_DIR=/app/data
      # Backtests are CPU-heavy: exactly one at a time, everything else
      # gets 429 and has to wait (the agents runner does).
      - FWBG_MAX_CONCURRENT_RUNS=1
      # Auth: the API is only reachable on the internal compose network (no
      # ports mapping). If FWBG_API_KEY is set in .env, X-API-Key is enforced;
      # otherwise the dev bypass keeps the stack working. The key branch wins
      # over the bypass, so both may be present.
      - FWBG_API_KEY=${FWBG_API_KEY:-}
      - FWBG_ALLOW_UNAUTHENTICATED_API=1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Dashboard Web Interface
  dashboard:
    image: ghcr.io/haexhub/fwbg-dashboard:latest
    container_name: fwbg-dashboard
    restart: unless-stopped
    ports:
      - "12100:3000"
    volumes:
      - fwbg-accounts:/app/accounts
      - fwbg-data:/app/data
      - fwbg-logs:/app/logs
      - fwbg-stats:/app/data/stats_export
    environment:
      - TZ=Europe/Berlin
      - DATA_PATH=/app/data
      - ACCOUNTS_PATH=/app/accounts
      - FWBG_API_URL=http://api:8420
      - FWBG_AGENTS_API_URL=http://agents:8421
      - CLAUDE_PROXY_URL=http://claude-proxy:8080
      - CLAUDE_PROXY_SETUP_TOKEN=${PROXY_SETUP_TOKEN:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - api
      - agents
      - claude-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Autonomous Agents (strategy research, backtesting, paper/live trading)
  agents:
    image: ghcr.io/haexhub/fwbg-agents:latest
    container_name: fwbg-agents
    restart: unless-stopped
    ports:
      - "12101:8421"
    volumes:
      - fwbg-data:/app/fwbg-data
      - agents-data:/app/data
      # Same workspace as the fwbg API: DSR snapshots read per-trade P&L
      # from /root/fwbg/test_results before retention can prune those runs.
      - type: volume
        source: fwbg-workspace
        target: /root/fwbg
        read_only: true
      - .:/fwbg-src:ro
    environment:
      - TZ=Europe/Berlin
      - FWBG_API_URL=http://api:8420
      # Must match the api service's FWBG_API_KEY when auth is enabled.
      - FWBG_API_KEY=${FWBG_API_KEY:-}
      - FWBG_DATA_DIR=/app/fwbg-data
      - FWBG_TEST_RESULTS_DIR=/root/fwbg/test_results
      - FWBG_REPO_ROOT=/fwbg-src
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://claude-proxy:8080}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-proxy-not-used-but-sdk-requires-it}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - IG_DEMO_USERNAME=${IG_DEMO_USERNAME:-}
      - IG_DEMO_PASSWORD=${IG_DEMO_PASSWORD:-}
      - IG_DEMO_API_KEY=${IG_DEMO_API_KEY:-}
      - IG_LIVE_USERNAME=${IG_LIVE_USERNAME:-}
      - IG_LIVE_PASSWORD=${IG_LIVE_PASSWORD:-}
      - IG_LIVE_API_KEY=${IG_LIVE_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - api
      - claude-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Anthropic-API-compatible proxy: lets the agents service consume a
  # Claude Pro/Max subscription via OAuth instead of metered API credits.
  # First-time setup: after `docker compose up`, visit
  # http://<host>:12102/setup/?token=$PROXY_SETUP_TOKEN once to log in.
  claude-proxy:
    image: ghcr.io/haexhub/haex-claude-proxy:latest
    container_name: claude-proxy
    restart: unless-stopped
    ports:
      - "12102:8080"
    volumes:
      - claude-proxy-creds:/data
    environment:
      - PROXY_RESOLVER=file
      - PROXY_CREDENTIALS_HOME=/data
      - PROXY_SETUP_TOKEN=${PROXY_SETUP_TOKEN:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Auto-Update Service
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - TZ=Europe/Berlin
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
    command: --interval 300

volumes:
  fwbg-accounts:
  fwbg-data:
  fwbg-logs:
  fwbg-stats:
  fwbg-workspace:
  fwbg-agent-plugins:
  agents-data:
  claude-proxy-creds:

services:
  # Trading Bot
  ig-bot:
    image: ghcr.io/haexhub/fwbg:latest
    container_name: fwbg-bot
    restart: unless-stopped
    volumes:
      - fwbg-accounts:/app/accounts
      - fwbg-data:/app/data
      - fwbg-logs:/app/logs
      - fwbg-stats:/app/data/stats_export
    environment:
      - TZ=Europe/Berlin
      - LOG_DIR=/app/logs
      - STATS_DIR=/app/data/stats_export
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Dashboard Web Interface
  dashboard:
    image: ghcr.io/haexhub/fwbg-dashboard:latest
    container_name: fwbg-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - fwbg-accounts:/app/accounts
      - fwbg-data:/app/data
      - fwbg-logs:/app/logs
      - fwbg-stats:/app/data/stats_export
    environment:
      - TZ=Europe/Berlin
      - DATA_PATH=/app/data
      - ACCOUNTS_PATH=/app/accounts
      - FWBG_API_URL=http://ig-bot:8420
      - FWBG_AGENTS_API_URL=http://agents:8421
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - ig-bot
      - agents
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Autonomous Agents (strategy research, backtesting, paper/live trading)
  agents:
    image: ghcr.io/haexhub/fwbg-agents:latest
    container_name: fwbg-agents
    restart: unless-stopped
    ports:
      - "8421:8421"
    volumes:
      - fwbg-data:/app/fwbg-data
      - agents-data:/app/data
      - .:/fwbg-src:ro
    environment:
      - TZ=Europe/Berlin
      - FWBG_API_URL=http://ig-bot:8420
      - FWBG_DATA_DIR=/app/fwbg-data
      - FWBG_REPO_ROOT=/fwbg-src
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://localhost:8080}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-proxy-not-used-but-sdk-requires-it}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-7}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - IG_DEMO_USERNAME=${IG_DEMO_USERNAME:-}
      - IG_DEMO_PASSWORD=${IG_DEMO_PASSWORD:-}
      - IG_DEMO_API_KEY=${IG_DEMO_API_KEY:-}
      - IG_LIVE_USERNAME=${IG_LIVE_USERNAME:-}
      - IG_LIVE_PASSWORD=${IG_LIVE_PASSWORD:-}
      - IG_LIVE_API_KEY=${IG_LIVE_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - ig-bot
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Auto-Update Service
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - TZ=Europe/Berlin
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
    command: --interval 300

volumes:
  fwbg-accounts:
  fwbg-data:
  fwbg-logs:
  fwbg-stats:
  agents-data:

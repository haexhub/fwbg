services:
  # Trading Bot
  ig-bot:
    image: ghcr.io/haexhub/fwbg:latest
    container_name: fwbg-bot
    restart: unless-stopped
    volumes:
      - fwbg-accounts:/app/accounts
      - fwbg-data:/app/data
      - fwbg-logs:/app/logs
      - fwbg-stats:/app/data/stats_export
    environment:
      - TZ=Europe/Berlin
      - LOG_DIR=/app/logs
      - STATS_DIR=/app/data/stats_export
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Dashboard Web Interface
  dashboard:
    image: ghcr.io/haexhub/fwbg-dashboard:latest
    container_name: fwbg-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - fwbg-accounts:/app/accounts
      - fwbg-data:/app/data
      - fwbg-logs:/app/logs
      - fwbg-stats:/app/data/stats_export
    environment:
      - TZ=Europe/Berlin
      - DATA_PATH=/app/data
      - ACCOUNTS_PATH=/app/accounts
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - ig-bot
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Auto-Update Service
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - TZ=Europe/Berlin
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
    command: --interval 300

volumes:
  fwbg-accounts:
  fwbg-data:
  fwbg-logs:
  fwbg-stats:

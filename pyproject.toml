[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwbg"
version = "2.10.8"
description = "Forex/Trading Strategy Optimizer with Plugin Architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "FWBG Team"}
]
keywords = ["trading", "forex", "optimization", "machine-learning", "xgboost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # SDK (plugin base classes, types, enums)
    "fwbg-sdk>=1.0.0",
    # Premium plugins (advanced indicators, exit strategies & more)
    "fwbg-premium>=1.0.0",
    # Core Data Processing
    # numpy <2.5 required by numba; pandas 3.0.4 yanked (segfaults in
    # datetime code with numpy 2.4, see pypi yank reason)
    "numpy>=2.2,<2.5",
    "pandas>=3.0,!=3.0.4",
    "scipy>=1.15",
    # ML / Optimization
    "xgboost>=3.0",
    "scikit-learn>=1.7",
    # Technical Analysis
    "ta>=0.11",
    "numba>=0.63",
    # Signal Processing
    "PyWavelets>=1.6",
    # Topological Data Analysis
    "ripser>=0.6",
    # Statistics (needed for preprocessing/stationarity tests)
    "statsmodels>=0.14",
    # Visualization (needed for CLI)
    "matplotlib>=3.10",
    # Utilities
    "tabulate>=0.9",
    "tqdm>=4.66",
    "psutil>=7.0",
    "PyYAML>=6.0",
    "holidays>=0.70",
    # Historical data download (Dukascopy adapter)
    "dukascopy-python>=4.0",
]

[project.optional-dependencies]
# Development tools
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.9",
    "black>=26.0",
    "isort>=7.0",
    "mypy>=1.15",
    "httpx>=0.27",
]
# Advanced analytics & visualization
analytics = [
    "seaborn>=0.13",
]
# Live trading with IG Markets
ig = [
    "trading-ig>=0.0.22",
    "yfinance>=1.0",
    "munch>=4.0",  # Optional but recommended for trading-ig
]
# REST API server
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.9",
    "watchfiles>=1.0",  # smarter hot-reload (inotify-based, replaces polling StatReload)
]
# All optional dependencies
full = [
    "fwbg[analytics,ig,api]",
]

[project.scripts]
fwbg = "fwbg.cli:main"

# Entry Points für Plugin-Discovery
# Plugins are now dynamically discovered from src/fwbg/plugins/
# using the import_plugin_module function (no entry points needed)

[project.entry-points."fwbg.broker_adapters"]
ig = "fwbg.adapters.broker.ig:IGBrokerAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src/fwbg/plugins",
    "packages/fwbg-premium/src/fwbg_premium/plugins",
    "packages/fwbg-sdk/tests",
]
python_files = ["test_*.py", "*.test.py", "tests.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"

[tool.uv.sources]
fwbg-sdk = { path = "packages/fwbg-sdk", editable = true }
fwbg-premium = { path = "packages/fwbg-premium", editable = true }

[dependency-groups]
dev = [
    "httpx2",
    "ruff>=0.14.14",
]

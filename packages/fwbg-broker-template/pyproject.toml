[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwbg-broker-BROKERNAME"  # TODO: Ersetze BROKERNAME
version = "1.0.0"
description = "BROKERNAME Broker Adapter für FWBG"  # TODO: Anpassen
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your@email.com"}  # TODO: Anpassen
]
keywords = ["trading", "forex", "broker", "fwbg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "fwbg>=2.0.0",
    # TODO: Füge broker-spezifische Dependencies hinzu
    # "broker-api-library>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]

# Entry Point für automatische Discovery durch fwbg
[project.entry-points."fwbg.broker_adapters"]
brokername = "fwbg_broker_brokername:MyBrokerAdapter"  # TODO: Anpassen

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwbg-mcp"
version = "0.1.0"
description = "MCP server for FWBG strategy optimizer – enables AI agents to autonomously configure, run, and evaluate trading strategies"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
fwbg-mcp = "fwbg_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
